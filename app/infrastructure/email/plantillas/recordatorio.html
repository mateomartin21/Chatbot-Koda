<!doctype html>
<html lang="es">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /></head>
<body style="margin:0;padding:24px 12px;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <!-- Todo el estilo va en linea: Gmail y Outlook tiran las hojas de estilo. -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;">
    <tr>
      <td style="padding:20px 24px;background:#0f1115;color:#ffffff;font-size:18px;font-weight:600;">
        🐺 Koda
      </td>
    </tr>
    <tr>
      <td style="padding:24px;color:#18181b;font-size:16px;line-height:1.55;">
        <h1 style="margin:0 0 16px;font-size:19px;line-height:1.3;color:#0f1115;">{{titulo}}</h1>
        {{cuerpo}}
      </td>
    </tr>
    <tr>
      <td style="padding:0 24px 24px;">
        <a href="{{url_app}}" style="display:inline-block;padding:12px 20px;background:#ff6a3d;color:#111111;text-decoration:none;border-radius:10px;font-weight:600;">
          Abrir Koda
        </a>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 24px;border-top:1px solid #e4e4e7;color:#71717a;font-size:12px;line-height:1.5;">
        Koda ofrece orientación de entrenamiento, no consejo médico.<br />
        <a href="{{url_baja}}" style="color:#71717a;">Dejar de recibir estos correos</a>
      </td>
    </tr>
  </table>
</body>
</html>
