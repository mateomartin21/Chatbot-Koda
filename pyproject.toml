[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
# ruff format reescribe tambien los bloques ```python de los .md, y docs/contexto es
# documentacion de referencia recibida: se lee, no se reformatea.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends(...) en valores por defecto es el patron de inyeccion de dependencias
# que exige FastAPI, no un bug — https://fastapi.tiangolo.com/tutorial/dependencies/
ignore = ["B008"]
