[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends(...) en valores por defecto es el patron de inyeccion de dependencias
# que exige FastAPI, no un bug — https://fastapi.tiangolo.com/tutorial/dependencies/
ignore = ["B008"]
